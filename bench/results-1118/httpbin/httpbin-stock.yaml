# Stock vHive path: firecracker-containerd boots its generic microVM and runs the image as a container.
# Identical image and Knative settings to vm.yaml; only GUEST_IMAGE differs (stock vHive reads the image to run from it).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: httpbin-stock
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/max-scale: "1"
    spec:
      containerConcurrency: 0
      containers:
      - env:
        - name: GUEST_PORT
          value: "80"
        - name: GUEST_IMAGE
          value: docker.io/kennethreitz/httpbin:latest
        image: docker.io/kennethreitz/httpbin:latest
        name: user-container
        ports:
        - containerPort: 80
          protocol: TCP
        readinessProbe:
          successThreshold: 1
          tcpSocket:
            port: 0
      enableServiceLinks: false
      timeoutSeconds: 300
