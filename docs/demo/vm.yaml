# Your per-pod Firecracker VM running the SAME image: vhive builds (or finds in its cache) an ext4 rootfs from the
# image of this pod, boots it with fcinit and points queue-proxy at GUEST_PORT. Pre-build first:
#   ~/vhive/bin/fc-rootfs build ghcr.io/vhive-serverless/crccheck-hello-world:latest
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: real-vm
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/max-scale: "1"
    spec:
      containerConcurrency: 0
      containers:
      - env:
        - name: GUEST_PORT
          value: "8000"
        - name: GUEST_IMAGE
          value: firecracker-vm://image
        image: ghcr.io/vhive-serverless/crccheck-hello-world:latest
        name: user-container
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          successThreshold: 1
          tcpSocket:
            port: 0
      enableServiceLinks: false
      timeoutSeconds: 300
